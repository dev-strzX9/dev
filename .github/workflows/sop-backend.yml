name: SOP backend
on:
  push:
    branches: [feat/sop-studio-backend]
  pull_request:
    paths: ['sop-backend/**', '.github/workflows/sop-backend.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sop
          POSTGRES_PASSWORD: sop
          POSTGRES_DB: sop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sop -d sop_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: sop-backend
    env:
      TEST_DATABASE_URL: postgresql://sop:sop@localhost:5432/sop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
